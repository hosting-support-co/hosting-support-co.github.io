<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Shop - Pickup Request</title>
    
    <!-- 1. EMAIL JS LIBRARY -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        /* Modern & Clean Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            color: #0056b3;
            margin-top: 0;
            text-align: center;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
            font-size: 14px;
        }

        input:focus, textarea:focus {
            border-color: #0056b3;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #003d80;
        }

        .status-msg {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🧺 Laundry Pickup</h2>
        <p style="text-align: center; color: #666;">Notify the shop owner for pickup</p>

        <!-- HTML Form Elements -->
        <label for="order_number">Order ID / Name</label>
        <input type="text" id="order_number" placeholder="e.g. #789 or John Doe">

        <label for="pickup_address">Pickup Address</label>
        <textarea id="pickup_address" rows="3" placeholder="Enter full address for pickup..."></textarea>

        <button onclick="sendNotify()">Send Request to Owner</button>
        
        <div id="status" class="status-msg"></div>
    </div>

    <!-- 2. JAVASCRIPT LOGIC -->
    <script type="text/javascript">
        // Replace with your PUBLIC KEY
        (function() {
            emailjs.init("isNVS6on9BL-DK_mr"); 
        })();

        function sendNotify() {
            const statusDiv = document.getElementById("status");
            const orderNum = document.getElementById("order_number").value;
            const address = document.getElementById("pickup_address").value;

            // Simple check to make sure fields aren't empty
            if (!orderNum || !address) {
                alert("Please fill out both the Order ID and the Address!");
                return;
            }

            // Update button status
            statusDiv.innerHTML = "Sending...";
            statusDiv.style.color = "blue";

            // Prepare the data to be sent
            // Make sure these names match the {{}} tags in your EmailJS template!
            const templateParams = {
                order_number: orderNum,
                pickup_address: address
            };

            // Replace with your SERVICE ID and TEMPLATE ID
            emailjs.send('service_1uwuhqs', 'template_zhmnmws', templateParams)
                .then(function(response) {
                   console.log('SUCCESS!', response.status, response.text);
                   statusDiv.innerHTML = "✅ Notification Sent Successfully!";
                   statusDiv.style.color = "green";
                   
                   // Reset inputs
                   document.getElementById("order_number").value = "";
                   document.getElementById("pickup_address").value = "";
                }, function(error) {
                   console.log('FAILED...', error);
                   statusDiv.innerHTML = "❌ Failed to send. Check console.";
                   statusDiv.style.color = "red";
                });
        }
    </script>

</body>
</html>
