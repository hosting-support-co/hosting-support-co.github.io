<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Sales List</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: turquoise;
    }

    .container {
      width: 80%;
      margin: 40px auto;
      background-color: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      color: #00796b;
    }

    .pos-info {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th {
      background-color: #009688;
      color: white;
      padding: 12px;
    }

    td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    .total {
      text-align: right;
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
      color: #00796b;
    }

    .button {
      display: block;
      width: 180px;
      margin: 25px auto 0;
      padding: 12px;
      background-color: #009688;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .button:hover {
      background-color: #00796b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>POS Sales List</h1>

    <div class="pos-info">
      <p><strong>Store Name:</strong> Turquoise Mini Mart</p>
      <p><strong>Date:</strong> January 25, 2026</p>
      <p><strong>Cashier:</strong> John Smith</p>
    </div>

    <table>
      <tr>
        <th>No.</th>
        <th>Product Name</th>
        <th>Quantity</th>
        <th>Price</th>
        <th>Total</th>
      </tr>

      <tr>
        <td>1</td>
        <td>Milk</td>
        <td>2</td>
        <td>$3.00</td>
        <td>$6.00</td>
      </tr>

      <tr>
        <td>2</td>
        <td>Bread</td>
        <td>1</td>
        <td>$2.50</td>
        <td>$2.50</td>
      </tr>

      <tr>
        <td>3</td>
        <td>Eggs</td>
        <td>1</td>
        <td>$4.00</td>
        <td>$4.00</td>
      </tr>

      <tr>
        <td>4</td>
        <td>Orange Juice</td>
        <td>2</td>
        <td>$5.00</td>
        <td>$10.00</td>
      </tr>
    </table>

    <div class="total">
      Grand Total: $22.50
    </div>

    <a href="#" class="button">Print Receipt</a>
  </div>

</body>
</html>
